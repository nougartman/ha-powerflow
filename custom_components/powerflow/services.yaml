start_charge:
  name: Start Charge
  description: Start charging a Powerflow-managed vehicle.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The vehicle_id as configured in the integration setup.
      required: true
      example: "hot_dog"
      selector:
        text:

stop_charge:
  name: Stop Charge
  description: Stop charging a Powerflow-managed vehicle.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: The vehicle_id as configured.
      required: true
      example: "hot_dog"
      selector:
        text:

set_charge_current:
  name: Set Charge Current
  description: Set the charging current (amps) for a vehicle.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      example: "hot_dog"
      selector:
        text:
    amps:
      name: Amperage
      description: Target charging amps (6-32).
      required: true
      example: 16
      selector:
        number:
          min: 6
          max: 32
          step: 1
          unit_of_measurement: A

log_away_charge:
  name: Log Away Charge
  description: >
    Manually log a charging session that occurred away from home (e.g. public
    charger or office) to keep reimbursement tracking accurate.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      example: "hot_dog"
      selector:
        text:
    energy_added_kwh:
      name: Energy Added (kWh)
      required: true
      example: 22.5
      selector:
        number:
          min: 0
          max: 120
          step: 0.1
          unit_of_measurement: kWh
    starting_soc:
      name: Starting SoC (%)
      example: 20
      selector:
        number:
          min: 0
          max: 100
    ending_soc:
      name: Ending SoC (%)
      example: 80
      selector:
        number:
          min: 0
          max: 100
    grid_cost:
      name: Grid Cost ($)
      description: Total cost of the session in AUD (from receipt).
      example: 8.75
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
    ended_at:
      name: Session Ended At
      description: ISO 8601 datetime (e.g. 2025-12-01T18:30:00Z).
      example: "2025-12-01T18:30:00Z"
      selector:
        text:

export_reimbursement_csv:
  name: Export Reimbursement CSV
  description: >
    Export the current billing cycle's charging sessions as a CSV report
    for novated lease reimbursement.
  fields:
    vehicle_id:
      name: Vehicle ID
      required: true
      example: "hot_dog"
      selector:
        text:

recalculate_fuel_savings:
  name: Recalculate Fuel Savings
  description: Force a refresh of the Powerflow coordinator and recalculate fuel savings.
