name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Validate & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Verify manifest version matches release tag
        run: |
          VERSION=$(jq -r .version custom_components/powerflow/manifest.json)
          TAG=${GITHUB_REF#refs/tags/v}
          echo "manifest=$VERSION  tag=$TAG"
          [ "$VERSION" = "$TAG" ] || (echo "Version mismatch!" && exit 1)
